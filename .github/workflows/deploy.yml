name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    name: Deploy to Server
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'

    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_KEY }}
          port: ${{ secrets.DEPLOY_PORT }}
          script: |
            set -e

            # 加载环境变量
            source ~/.bashrc 2>/dev/null || source ~/.profile 2>/dev/null || true
            export PATH="$HOME/.npm-global/bin:$HOME/.local/bin:$HOME/.bun/bin:/usr/local/bin:$PATH"

            # 检测并安装 bun（幂等，服务器已有 bun 则跳过）
            if ! command -v bun &> /dev/null; then
              echo "安装 bun..."
              curl -fsSL https://bun.sh/install | bash
              export PATH="$HOME/.bun/bin:$PATH"
            fi

            # 进入部署目录
            DEPLOY_DIR="${{ secrets.DEPLOY_PATH }}"
            DEPLOY_DIR="${DEPLOY_DIR/#\~/$HOME}"
            cd "$DEPLOY_DIR" || exit 1

            echo "拉取最新代码..."
            git pull origin main || { echo "❌ 拉取代码失败"; exit 1; }

            # 确保 Node 22 环境（better-sqlite3 ABI 要求）
            echo "确保 Node 22 环境（better-sqlite3 ABI 要求）..."
            export NVM_DIR="$HOME/.nvm"
            if [ -s "$NVM_DIR/nvm.sh" ]; then
              . "$NVM_DIR/nvm.sh"
              nvm use 22 >/dev/null 2>&1 || nvm install 22 >/dev/null 2>&1 || true
            fi
            node -v || true

            echo "安装依赖..."
            bun install --frozen-lockfile || { echo "❌ 安装依赖失败"; exit 1; }

            echo "运行单元测试..."
            bun run test || { echo "❌ 单元测试失败"; exit 1; }

            echo "构建项目..."
            bun run build || { echo "❌ 构建失败"; exit 1; }

            # 启动/重启服务
            if command -v pm2 &> /dev/null && pm2 list 2>/dev/null | grep -q "napcat-platform"; then
              echo "重启服务..."
              pm2 restart napcat-platform || { echo "❌ 重启服务失败"; exit 1; }
            else
              echo "首次启动服务..."
              pm2 start bun --name napcat-platform -- run start || { echo "❌ 启动服务失败"; exit 1; }
              pm2 save
            fi

            echo "部署完成 ✅"
